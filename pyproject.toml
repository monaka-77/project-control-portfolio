[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-control-portfolio"
version = "0.1.0"
description = "Public portfolio edition of ProjectControl."
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-dir = "tests"
pattern = "test*.py"
